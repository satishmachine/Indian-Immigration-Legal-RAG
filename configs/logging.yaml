"""
Logging configuration YAML for production deployments.

This file is used by Python's dictConfig when the application is deployed
with a process manager (e.g., systemd, Docker).  In development, the
configure_logging() function in core/logging/logger.py is used instead.
"""

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

  console:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: console
    stream: ext://sys.stdout

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/app.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: logs/errors.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf-8

loggers:
  # Application namespaces
  core:
    level: DEBUG
    handlers: [console, json_file]
    propagate: false

  ingestion:
    level: DEBUG
    handlers: [console, json_file]
    propagate: false

  retrieval:
    level: DEBUG
    handlers: [console, json_file]
    propagate: false

  services:
    level: DEBUG
    handlers: [console, json_file]
    propagate: false

  api:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  app:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  # Third-party – suppress noisy DEBUG logs
  httpx:
    level: WARNING
    handlers: [console]
    propagate: false

  httpcore:
    level: WARNING
    handlers: [console]
    propagate: false

  openai:
    level: WARNING
    handlers: [console]
    propagate: false

  qdrant_client:
    level: WARNING
    handlers: [console]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console, error_file]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [console, json_file]
    propagate: false

  langchain:
    level: INFO
    handlers: [console, json_file]
    propagate: false

root:
  level: INFO
  handlers: [console, json_file, error_file]
